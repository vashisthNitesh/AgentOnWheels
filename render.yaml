services:
  - type: web
    name: axle-tms
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: "*"
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: DEFAULT_DISPLAY_TZ
        value: "Asia/Dubai"
      - key: CREATE_ADMIN
        value: "1"
      - key: DJANGO_ADMIN_PASSWORD
        value: "admin"
      - key: SEED_DEMO
        value: "1"
      - key: DATABASE_URL
        sync: false
